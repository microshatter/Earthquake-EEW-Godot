name: "Godot Export"

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # job id, can be anything
  export_game:
    # Always use ubuntu-latest for this action
    runs-on: ubuntu-latest
    # Add permission for release creation. Can be made narrower according to your needs
    permissions:
      contents: write
    # Job name, can be anything
    name: Export Game
    steps:
      # Always include the checkout step so that 
      # your project is available for Godot to export
    - name: checkout
      uses: actions/checkout@v5
  
    - name: export game
      id: export
      # Use latest version (see releases for all versions)
      uses: firebelley/godot-export@v8.0.0
      with:
        # Defining all the required inputs
        godot_executable_download_url: https://downloads.godotengine.org/?version=4.7.1&flavor=stable&slug=linux.x86_64.zip&platform=linux.64
        godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.7.1&flavor=stable&slug=export_templates.tpz&platform=templates
        relative_project_path: ./
        archive_output: true

      # This release action has worked well for me. However, you can most likely use any release action of your choosing.
      # https://github.com/ncipollo/release-action
    - name: create release
      if: ${{ startsWith(github.ref, 'refs/tags')}}
      uses: ncipollo/release-action@v1.18.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        generateReleaseNotes: true
        # tag: ${{ github.ref_name }}
        allowUpdates: true
        artifacts: ${{ steps.export.outputs.archive_directory }}/*
        draft: true
        
    - name: upload artifacts
      if: ${{ !startsWith(github.ref, 'refs/tags') }}
      uses: actions/upload-artifact@v7
      with:
        name: godot-builds
        path: ${{ steps.export.outputs.archive_directory }}/*